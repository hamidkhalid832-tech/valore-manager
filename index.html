<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valore Business Manager</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d0d0d">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#111;--mut:#777;--gold:#b89b52;--side:#0d0d0d;--line:#e8e4da}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
h1,h2,.num{font-family:Georgia,serif;font-weight:500;margin:0}
nav{width:210px;background:var(--side);padding:18px 10px;position:sticky;top:0;height:100vh;flex:none}
nav b{display:block;color:#fff;letter-spacing:3px;padding:6px 12px 18px;font-size:15px}
nav a{display:block;color:#bbb;padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px}
nav a.on{background:#222;color:#fff;box-shadow:inset 3px 0 var(--gold)}
main{flex:1;padding:24px;min-width:0;max-width:1200px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.top h1{font-size:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.card small,.mut{color:var(--mut);font-size:12px}.num{font-size:26px;margin:6px 0}
button{background:#111;color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font:inherit}
button.ghost{background:#fff;color:#111;border:1px solid var(--line)}button.sm{padding:4px 8px;font-size:12px;background:#fff;color:#111;border:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12px}.bar span:first-child{width:90px}.bar i{flex:1;height:6px;background:#eee;border-radius:4px;overflow:hidden}.bar u{display:block;height:100%;background:var(--gold)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;color:var(--mut);text-transform:uppercase}
.warn{background:#fff7e0;border:1px solid #f0e0a8;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.low{color:#b3261e;font-weight:600}.mod{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}
.mod form{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:420px;max-height:92vh;overflow:auto}
label{display:block;margin:10px 0;font-size:12px;color:var(--mut)}input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-top:4px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qa button{background:#fff;color:#111;border:1px solid var(--line);text-align:left;padding:12px}
@media(max-width:800px){body{flex-direction:column-reverse}nav{width:100%;height:auto;position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;padding:6px;z-index:5}nav b{display:none}nav a{white-space:nowrap;margin:0 2px;padding:10px}main{padding:14px 12px 80px}.grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style></head><body>
<nav id="nav"><b>VALORE</b></nav><main id="main"></main>
<script>
const K='valore_db',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toISOString().slice(0,10),rs=n=>'Rs '+Math.round(n||0).toLocaleString('en-PK'),sum=(a,f)=>a.reduce((t,x)=>t+f(x),0),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fresh=()=>({products:[],sales:[],orders:[],expenses:[],accounts:[],txns:[]});
let db;try{db=JSON.parse(localStorage.getItem(K))||fresh()}catch(e){db=fresh()}
db={...fresh(),...db};
const P=id=>db.products.find(p=>p.id==id);
function save(){try{localStorage.setItem(K,JSON.stringify(db));let s=JSON.parse(localStorage.getItem('valore_snaps')||'{}');s[today()]=JSON.stringify(db);Object.keys(s).sort().slice(0,-7).forEach(k=>delete s[k]);localStorage.setItem('valore_snaps',JSON.stringify(s))}catch(e){alert('Storage full - backup download karein!')}go(cur)}
const T=()=>{const rev=sum(db.sales,s=>s.qty*s.price),cost=sum(db.sales,s=>s.cost),exp=sum(db.expenses,e=>e.amt);return{rev,cost,exp,net:rev-cost-exp}};
const tbl=(h,r)=>`<div class=tw><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${h.length} class=mut>Abhi koi record nahi</td></tr>`}</table></div>`;
const bt=(l,fn,id)=>`<button class=sm onclick="${fn}('${id}')">${l}</button>`;
function modal(title,fields,vals,ok){const m=document.createElement('div');m.className='mod';m.innerHTML=`<form><h2>${title}</h2>`+fields.map(f=>`<label>${f.l}${f.o?`<select name=${f.k}>${f.o.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>`:`<input name=${f.k} type=${f.t||'text'} step=any ${f.r?'required':''}>`}</label>`).join('')+`<div class=row><button type=button class=ghost>Cancel</button><button>Save</button></div></form>`;document.body.append(m);const fm=m.querySelector('form');fields.forEach(f=>fm.elements[f.k].value=vals[f.k]??'');fm.querySelector('.ghost').onclick=()=>m.remove();fm.onsubmit=e=>{e.preventDefault();const o={};fields.forEach(f=>{let v=fm.elements[f.k].value;o[f.k]=f.t=='number'?(v===''?'':+v):v});m.remove();ok(o)}}
function del(col,id){if(!confirm('Delete karna hai?'))return;if(col=='sales'){const s=db.sales.find(x=>x.id==id),p=s&&P(s.pid);if(p)p.stock+=s.qty}db[col]=db[col].filter(x=>x.id!=id);save()}
const pf=[{k:'name',l:'Product name',r:1},{k:'cat',l:'Category (Shirt, Kurta...)'},{k:'size',l:'Size'},{k:'color',l:'Color'},{k:'cost',l:'Cost price (Rs)',t:'number',r:1},{k:'price',l:'Selling price (Rs)',t:'number',r:1},{k:'stock',l:'Stock (pieces)',t:'number',r:1},{k:'low',l:'Low stock alert at',t:'number'}];
function addP(){modal('Add product',pf,{stock:0,low:2},o=>{db.products.push({id:uid(),...o});save()})}
function editP(id){const p=P(id);modal('Edit product',pf,p,o=>{Object.assign(p,o);save()})}
function addS(){if(!db.products.length)return alert('Pehle product add karein');const f=[{k:'date',l:'Date',t:'date',r:1},{k:'pid',l:'Product',o:db.products.map(p=>[p.id,`${p.name} ${p.size||''} ${p.color||''} (stock ${p.stock})`])},{k:'qty',l:'Quantity',t:'number',r:1},{k:'price',l:'Price per piece (blank = default)',t:'number'},{k:'cust',l:'Customer name'},{k:'phone',l:'Phone'},{k:'acc',l:'Payment received in (account)',o:accOpts()}];
modal('Record sale',f,{date:today(),qty:1},o=>{const p=P(o.pid);if(o.qty>p.stock&&!confirm('Stock kam hai, phir bhi save karein?'))return;p.stock-=o.qty;db.sales.push({id:uid(),date:o.date,pid:p.id,pname:p.name,qty:o.qty,price:o.price===''?p.price:o.price,cost:p.cost*o.qty,cust:o.cust||'Walk-in',phone:o.phone,acc:o.acc});save()})}
const st=['New','Confirmed','Shipped','Delivered','Cancelled'],of=[{k:'date',l:'Date',t:'date',r:1},{k:'cust',l:'Customer',r:1},{k:'phone',l:'Phone'},{k:'items',l:'Items / address'},{k:'total',l:'Total (Rs)',t:'number'},{k:'status',l:'Status',o:st.map(s=>[s,s])}];
function addO(){modal('New order',of,{date:today(),status:'New'},o=>{db.orders.push({id:uid(),...o});save()})}
function editO(id){const x=db.orders.find(o=>o.id==id);modal('Edit order',of,x,o=>{Object.assign(x,o);save()})}
function stO(id,v){db.orders.find(o=>o.id==id).status=v;save()}
function addE(){modal('Add expense',[{k:'date',l:'Date',t:'date',r:1},{k:'title',l:'Detail (rent, packing, ads...)',r:1},{k:'amt',l:'Amount (Rs)',t:'number',r:1},{k:'acc',l:'Paid from (account)',o:accOpts()}],{date:today()},o=>{db.expenses.push({id:uid(),...o});save()})}
const accOpts=()=>[['','— none —'],...db.accounts.map(a=>[a.id,a.name])];
const bal=a=>+a.open+sum(db.sales.filter(s=>s.acc==a.id),s=>s.qty*s.price)-sum(db.expenses.filter(e=>e.acc==a.id),e=>e.amt)+sum(db.txns.filter(t=>t.acc==a.id),t=>t.amt);
const af=[{k:'name',l:'Account name (Cash, Bank, Easypaisa...)',r:1},{k:'open',l:'Opening balance (Rs)',t:'number',r:1}];
function addA(){modal('Add account',af,{open:0},o=>{db.accounts.push({id:uid(),...o});save()})}
function editA(id){const a=db.accounts.find(x=>x.id==id);modal('Edit account',af,a,o=>{Object.assign(a,o);save()})}
function txA(id){modal('Deposit / Withdraw',[{k:'date',l:'Date',t:'date',r:1},{k:'type',l:'Type',o:[['in','Deposit (paise aaye)'],['out','Withdraw (paise nikle)']]},{k:'amt',l:'Amount (Rs)',t:'number',r:1},{k:'note',l:'Note (stock kharida, transfer...)'}],{date:today(),type:'in'},o=>{db.txns.push({id:uid(),date:o.date,acc:id,amt:o.type=='in'?o.amt:-o.amt,note:o.note});save()})}
const delA=id=>{if(confirm('Account delete karna hai?')){db.accounts=db.accounts.filter(a=>a.id!=id);save()}},delT=id=>del('txns',id);
const accBox=()=>`<div class=card><h2>Account balances</h2><br>${db.accounts.map(a=>`<div class=bar><span style="flex:1;width:auto">${esc(a.name)}</span><b>${rs(bal(a))}</b></div>`).join('')||'<span class=mut>Accounts page se account add karein</span>'}<hr style="border:0;border-top:1px solid var(--line)"><b>Total: ${rs(sum(db.accounts,bal))}</b></div>`;
const openO=()=>db.orders.filter(o=>!['Delivered','Cancelled'].includes(o.status));
const V={
dash(){const t=T(),lows=db.products.filter(p=>p.stock<=(p.low??2)),recent=[...db.sales].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6),mx=Math.max(t.rev,1),b=(l,v)=>`<div class=bar><span>${l}</span><i><u style="width:${Math.max(0,v)/mx*100}%"></u></i><span>${rs(v)}</span></div>`;
const days=Math.floor((Date.now()-(+localStorage.getItem('valore_lastexp')||0))/864e5);
return `<div class=top><h1>Dashboard</h1><button onclick=addS()>+ Add sale</button></div>${days>=7?`<div class=warn>⚠ ${localStorage.getItem('valore_lastexp')?days+' din se':'Abhi tak'} backup download nahi kiya. Settings &gt; Backup se file save karein.</div>`:''}
<div class=grid><div class=card><small>Sales recorded</small><div class=num>${rs(t.rev)}</div><small>${db.sales.length} sale(s)</small></div><div class=card><small>Estimated net profit</small><div class=num>${rs(t.net)}</div><small>Sales − cost − expenses</small></div><div class=card><small>Stock cost value</small><div class=num>${rs(sum(db.products,p=>p.stock*p.cost))}</div><small>${sum(db.products,p=>p.stock)} units</small></div><div class=card><small>Open orders</small><div class=num>${openO().length}</div><small>${db.orders.length} total</small></div></div>
<div class=grid2><div><div class=card><h2>Business overview</h2>${b('Sales',t.rev)}${b('Product cost',t.cost)}${b('Expenses',t.exp)}${b('Net profit',t.net)}</div><div class=card><h2>Recent activity</h2>${tbl(['Date','Customer','Item','Amount'],recent.map(s=>[s.date,esc(s.cust),esc(s.pname),rs(s.qty*s.price)]))}</div></div>
<div><div class=card><h2>Quick actions</h2><br><div class=qa><button onclick=addP()>+ Add product</button><button onclick=addS()>↗ Record sale</button><button onclick=addO()>New order</button><button onclick=addE()>− Add expense</button></div></div>${accBox()}<div class=card><h2>Stock attention</h2><br>${lows.map(p=>`<div class=low>${esc(p.name)} ${esc(p.size)} — ${p.stock} left</div>`).join('')||'<span class=mut>Sab stock theek hai</span>'}</div></div></div>`},
inv(){return `<div class=top><h1>Inventory</h1><button onclick=addP()>+ Add product</button></div><div class=card>${tbl(['Product','Cat','Size','Color','Cost','Price','Stock',''],db.products.map(p=>[esc(p.name),esc(p.cat),esc(p.size),esc(p.color),rs(p.cost),rs(p.price),`<span class="${p.stock<=(p.low??2)?'low':''}">${p.stock}</span>`,bt('Edit','editP',p.id)+' '+bt('Del','delP',p.id)]))}</div>`},
sales(){return `<div class=top><h1>Sales</h1><button onclick=addS()>+ Add sale</button></div><div class=card>${tbl(['Date','Customer','Product','Qty','Total','Profit',''],[...db.sales].sort((a,b)=>b.date.localeCompare(a.date)).map(s=>[s.date,esc(s.cust),esc(s.pname),s.qty,rs(s.qty*s.price),rs(s.qty*s.price-s.cost),bt('Del','delS',s.id)]))}</div>`},
orders(){return `<div class=top><h1>Orders</h1><button onclick=addO()>+ New order</button></div><div class=card>${tbl(['Date','Customer','Phone','Details','Total','Status',''],[...db.orders].reverse().map(o=>[o.date,esc(o.cust),esc(o.phone),esc(o.items),rs(o.total),`<select onchange="stO('${o.id}',this.value)">${st.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select>`,bt('Edit','editO',o.id)+' '+bt('Del','delO',o.id)]))}</div>`},
cust(){const m={};[...db.sales,...db.orders].forEach(x=>{const c=m[x.cust]=m[x.cust]||{n:0,t:0,ph:''};c.n++;c.t+=x.qty?x.qty*x.price:+x.total||0;if(x.phone)c.ph=x.phone});return `<div class=top><h1>Customers</h1></div><div class=card>${tbl(['Name','Phone','Purchases','Total'],Object.entries(m).sort((a,b)=>b[1].t-a[1].t).map(([k,c])=>[esc(k),esc(c.ph),c.n,rs(c.t)]))}<small class=mut>Customers sales aur orders se khud ban jate hain.</small></div>`},
exp(){return `<div class=top><h1>Expenses</h1><button onclick=addE()>+ Add expense</button></div><div class=card>${tbl(['Date','Detail','Amount',''],[...db.expenses].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>[e.date,esc(e.title),rs(e.amt),bt('Del','delE',e.id)]))}</div>`},
acc(){const nm=id=>esc((db.accounts.find(a=>a.id==id)||{}).name);return `<div class=top><h1>Accounts</h1><button onclick=addA()>+ Add account</button></div><div class=card><small>Total balance (sab accounts)</small><div class=num>${rs(sum(db.accounts,bal))}</div></div><div class=card>${tbl(['Account','Opening','Balance',''],db.accounts.map(a=>[esc(a.name),rs(a.open),`<b>${rs(bal(a))}</b>`,bt('Deposit/Withdraw','txA',a.id)+' '+bt('Edit','editA',a.id)+' '+bt('Del','delA',a.id)]))}<small class=mut>Balance = opening + sales − expenses ± deposit/withdraw. Sale ya expense add karte waqt account select karein.</small></div><div class=card><h2>Deposit / Withdraw history</h2>${tbl(['Date','Account','Amount','Note',''],[...db.txns].reverse().map(t=>[t.date,nm(t.acc),rs(t.amt),esc(t.note),bt('Del','delT',t.id)]))}</div>`},
rep(){const m={},q={};db.sales.forEach(s=>{const k=s.date.slice(0,7);m[k]=m[k]||{r:0,c:0,e:0};m[k].r+=s.qty*s.price;m[k].c+=s.cost;q[s.pname]=(q[s.pname]||0)+s.qty});db.expenses.forEach(e=>{const k=e.date.slice(0,7);m[k]=m[k]||{r:0,c:0,e:0};m[k].e+=e.amt});
return `<div class=top><h1>Reports</h1></div><div class=card><h2>Monthly</h2>${tbl(['Month','Sales','Cost','Expenses','Net profit'],Object.keys(m).sort().reverse().map(k=>[k,rs(m[k].r),rs(m[k].c),rs(m[k].e),rs(m[k].r-m[k].c-m[k].e)]))}</div><div class=card><h2>Best sellers</h2>${tbl(['Product','Pieces sold'],Object.entries(q).sort((a,b)=>b[1]-a[1]).slice(0,10))}</div>`},
set(){const s=JSON.parse(localStorage.getItem('valore_snaps')||'{}');return `<div class=top><h1>Settings &amp; Backup</h1></div><div class=card><h2>Backup</h2><p class=mut>Data aap ke device mein save hota hai (offline kaam karta hai). Har change par daily auto-snapshot (last 7 din) banta hai. Hafte mein ek baar file download karke Google Drive / WhatsApp pe save karein.</p><div class=row style="justify-content:flex-start"><button onclick=exp()>⬇ Download backup</button><button class=ghost onclick="$('#f').click()">⬆ Restore from file</button><input id=f type=file accept=.json hidden onchange=imp(this)></div></div><div class=card><h2>Auto snapshots</h2>${tbl(['Date','Records',''],Object.keys(s).sort().reverse().map(k=>[k,(d=>d.sales.length+' sales, '+d.products.length+' products')(JSON.parse(s[k])),bt('Restore','snap',k)]))}</div><div class=card><h2>Danger zone</h2><button class=ghost onclick=wipe()>Sab data delete karein</button></div>`}};
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download=`valore-backup-${today()}.json`;a.click();localStorage.setItem('valore_lastexp',Date.now())}
function imp(i){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.sales)throw 0;if(confirm('Current data replace ho jayega. Continue?')){db={...fresh(),...d};save()}}catch(e){alert('File sahi nahi hai')}};r.readAsText(i.files[0])}
function snap(k){if(confirm(k+' ka snapshot restore karein?')){db=JSON.parse(JSON.parse(localStorage.getItem('valore_snaps'))[k]);save()}}
function wipe(){if(prompt('Type DELETE')=='DELETE'){db=fresh();save()}}
const delP=id=>del('products',id),delS=id=>del('sales',id),delO=id=>del('orders',id),delE=id=>del('expenses',id);
const names={dash:'Dashboard',inv:'Inventory',sales:'Sales',orders:'Orders',cust:'Customers',exp:'Expenses',acc:'Accounts',rep:'Reports',set:'Settings & Backup'};let cur='dash';
$('#nav').innerHTML+=Object.entries(names).map(([k,v])=>`<a data-v=${k} onclick="go('${k}')">${v}</a>`).join('');
function go(v){cur=v;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==v));$('#main').innerHTML=V[v]()}
go('dash');navigator.storage?.persist?.();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
